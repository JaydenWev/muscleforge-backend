name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore MuscleForge.Backend.sln
      - run: dotnet build MuscleForge.Backend.sln -c Release --no-restore
      - run: dotnet test MuscleForge.Backend.sln -c Release --no-build --logger trx
      - run: python3 scripts/export-openapi.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-checks
          path: |
            **/TestResults/*.trx
            **/packages.lock.json

  container:
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t muscleforge-backend:ci .
      - name: Create isolated development configuration
        run: printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
      - name: Start API and real PostgreSQL
        run: docker compose up --build -d
      - name: Verify database readiness
        run: curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:5187/health/ready
      - name: Stop containers
        if: always()
        run: docker compose down -v
