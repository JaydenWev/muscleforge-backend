name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore MuscleForge.Backend.sln
      - run: dotnet tool restore
      - run: dotnet build MuscleForge.Backend.sln -c Release --no-restore
      - run: dotnet test MuscleForge.Backend.sln -c Release --no-build --logger trx
      - name: Verify model and migration snapshot match
        env:
          ConnectionStrings__Database: Host=localhost;Database=muscleforge;Username=muscleforge
        run: dotnet ef migrations has-pending-model-changes --project src/MuscleForge.Infrastructure --startup-project src/MuscleForge.Api --configuration Release --no-build
      - run: python3 scripts/export-openapi.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-checks
          path: |
            **/TestResults/*.trx
            **/packages.lock.json

  container:
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore projects for host migration tooling
        run: dotnet restore src/MuscleForge.Api/MuscleForge.Api.csproj
      - name: Build container
        run: docker build -t muscleforge-backend:ci .
      - name: Create isolated development configuration
        run: |
          umask 077
          printf 'POSTGRES_PASSWORD=%s\nOWNER_EMAIL=ci-owner@example.test\nOWNER_PASSWORD=%sAa1!\nDATA_PROTECTION_CERTIFICATE_PASSWORD=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > .env
          mkdir -p .secrets
          export DATA_PROTECTION_CERTIFICATE_PASSWORD="$(sed -n 's/^DATA_PROTECTION_CERTIFICATE_PASSWORD=//p' .env)"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .secrets/key.pem -out .secrets/cert.pem -days 2 -subj '/CN=MuscleForge CI' 2>/dev/null
          openssl pkcs12 -export -out .secrets/dataprotection.pfx -inkey .secrets/key.pem -in .secrets/cert.pem -passout env:DATA_PROTECTION_CERTIFICATE_PASSWORD
          rm .secrets/key.pem .secrets/cert.pem
          chmod 644 .secrets/dataprotection.pfx
      - name: Start real PostgreSQL
        run: docker compose up -d --wait database
      - run: dotnet tool restore
      - name: Apply migrations explicitly before API startup
        shell: bash
        run: |
          set -a
          source .env
          set +a
          export ConnectionStrings__Database="Host=localhost;Port=5432;Database=muscleforge;Username=muscleforge;Password=$POSTGRES_PASSWORD"
          dotnet ef database update --project src/MuscleForge.Infrastructure --startup-project src/MuscleForge.Api --configuration Release
      - name: Start API with migrated database
        run: docker compose up --build -d api
      - name: Verify database readiness
        run: curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:5187/health/ready
      - name: Verify configured owner was provisioned
        run: test "$(docker compose exec -T database psql -U muscleforge -d muscleforge -Atc 'SELECT COUNT(*) FROM "AspNetUsers";')" = 1
      - name: Stop containers
        if: always()
        run: docker compose down -v
